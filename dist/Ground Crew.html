body {
  background:
    radial-gradient(1200px 500px at 80% -10%, rgba(124, 196, 255, .10), transparent 60%),
    radial-gradient(900px 400px at 0% 0%, rgba(255, 181, 71, .06), transparent 60%),
    linear-gradient(180deg, #0a1322 0%, #0d1828 55%, #111a24 100%);
  background-color: var(--night);
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
svg.ico { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Header: the terminal sign gantry ---------- */
header.top { position: sticky; top: 0; z-index: 10; background: #070b12; border-bottom: 3px solid var(--sign); box-shadow: 0 6px 24px rgba(0, 0, 0, .4); }
header.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; gap: 3px; align-items: center; }
.brand .plane { color: var(--sign); font-size: 20px; margin-right: 8px; }
nav.stations { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
nav.stations button {
  display: flex; align-items: center; gap: 8px;
  background: var(--signdark); color: var(--sign); border: 0; border-radius: 4px;
  padding: 6px 10px 6px 6px; cursor: pointer;
  font: 600 15px/1 var(--cond); letter-spacing: .02em;
}
nav.stations button .n { font: 800 12px/1 var(--mono); background: var(--sign); color: var(--sign-ink); border-radius: 3px; padding: 4px 5px; }
nav.stations button.on { background: var(--sign); color: var(--sign-ink); }
nav.stations button.on .n { background: var(--sign-ink); color: var(--sign); }
nav.stations button:disabled { opacity: .35; cursor: default; }
nav.stations button .arrow { font-family: var(--sans); font-weight: 700; }
.hdr-tools { display: flex; align-items: center; gap: 8px; }
.radio { display: flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); color: var(--green); border: 1px solid #1f3a2f; background: #0b1912; border-radius: 6px; padding: 8px 10px; white-space: nowrap; letter-spacing: .04em; }
.radio .lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: lamp 2.4s ease-in-out infinite; }
.radio.warn { color: var(--yellow); border-color: #4a3d14; background: #1a1607; }
.radio.warn .lamp { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.radio.bad { color: var(--red); border-color: #4a1c1c; background: #1a0b0b; }
.radio.bad .lamp { background: var(--red); box-shadow: 0 0 8px var(--red); }
@keyframes lamp { 50% { opacity: .45; } }
.toggle { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; color: var(--muted); font-size: 13px; }
.toggle.on { color: var(--ink); border-color: var(--muted); }

main { padding: 28px 0 120px; }
.station-sign { display: inline-flex; align-items: stretch; margin: 0 0 14px; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
.station-sign .num { background: var(--signdark); color: var(--sign); font: 800 30px/1 var(--mono); padding: 10px 14px; display: flex; align-items: center; }
.station-sign .name { background: var(--sign); color: var(--sign-ink); font: 800 30px/1 var(--cond); letter-spacing: .02em; padding: 10px 18px; display: flex; align-items: center; gap: 12px; text-transform: uppercase; }
.station-sign .name svg.ico { stroke-width: 2.4; width: 28px; height: 28px; }
h1 { font: 800 46px/1.05 var(--cond); letter-spacing: .01em; margin: 6px 0 10px; }
h2 { font: 800 28px/1.1 var(--cond); margin: 0 0 6px; letter-spacing: .02em; }
h3 { font: 600 20px/1.2 var(--cond); margin: 0 0 10px; letter-spacing: .03em; text-transform: uppercase; }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 72ch; font-size: 17px; }

/* ---------- The Marshal (art arrives later; this is the radio box) ---------- */
.marshal { display: flex; gap: 14px; align-items: center; margin: 0 0 22px; }
.marshal .who { flex: none; width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #ffd9a8, #ff9c3a); display: grid; place-items: center; font-size: 28px; box-shadow: 0 0 0 3px var(--hivis), 0 0 0 6px rgba(255, 122, 26, .2); }
.marshal .bubble { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; font-size: 17px; }
.marshal .bubble::before { content: ""; position: absolute; left: -8px; top: 50%; width: 14px; height: 14px; background: var(--panel); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateY(-50%) rotate(45deg); }
.marshal .bubble .tag { font: 800 11px/1 var(--mono); color: var(--hivis); letter-spacing: .12em; display: block; margin-bottom: 4px; }
.marshal b { color: var(--amber); }

/* ---------- Split-flap ---------- */
.flaps { display: inline-flex; gap: 2px; }
.flap { position: relative; display: inline-grid; place-items: center; width: .9em; height: 1.3em; background: linear-gradient(180deg, #23262b 0%, #1a1c20 49%, #0d0e10 50%, #1b1d21 100%); color: var(--yellow); font: 800 1em/1 var(--mono); border-radius: 3px; box-shadow: inset 0 0 0 1px #000, 0 1px 0 rgba(255, 255, 255, .05); }
.flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, .8); }
.flap.spin { animation: flip .07s linear; }
@keyframes flip { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); } 100% { transform: scaleY(1); } }
.brand .flap { font-size: 14px; color: #fff; }
.flaps.green .flap { color: var(--green); }
.flaps.red .flap { color: var(--red); }
.flaps.white .flap { color: #f2f2f2; }

.board { background: #07090c; border-radius: 12px; padding: 16px 18px; box-shadow: inset 0 0 0 1px #20252c, 0 10px 30px rgba(0, 0, 0, .35); margin: 0 0 18px; overflow-x: auto; }
.board .bhead { display: flex; align-items: center; gap: 10px; color: var(--sign); font: 800 16px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; padding-bottom: 12px; border-bottom: 1px solid #20252c; margin-bottom: 12px; }
.board .bhead .ico { width: 22px; height: 22px; }
.board .rows { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; align-items: center; font-size: 22px; }
.board .k { color: #7d8a9a; font: 600 15px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; }
.board.big .rows { font-size: 22px; }

/* ---------- Cards, buttons ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); font: 800 18px/1 var(--cond); letter-spacing: .04em; text-transform: uppercase; padding: 13px 20px; box-shadow: 0 3px 0 #a07e00; }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #a07e00; }
.btn.small { padding: 5px 10px; font-size: 14px; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.small { font-size: 14px; }
.note { font-size: 14px; color: var(--muted); }
.next { margin-top: 22px; }

/* ---------- Check-in ---------- */
.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: center; margin-bottom: 26px; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.ticket { position: relative; display: grid; grid-template-columns: 1fr 120px; background: var(--paper); color: var(--paper-ink); border-radius: 16px; min-height: 210px; cursor: pointer; transition: transform .15s; box-shadow: 0 14px 40px rgba(0, 0, 0, .35); }
.ticket:hover, .ticket.over { transform: translateY(-3px) rotate(-.4deg); }
.ticket.over { outline: 3px dashed var(--hivis); outline-offset: 4px; }
.ticket .main { padding: 22px 24px; border-right: 2px dashed var(--paper-line); }
.ticket .stub { padding: 22px 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.ticket::before, .ticket::after { content: ""; position: absolute; right: 111px; width: 18px; height: 18px; border-radius: 50%; background: var(--night); }
.ticket::before { top: -9px; } .ticket::after { bottom: -9px; }
.ticket .airline { font: 800 13px/1 var(--mono); letter-spacing: .2em; color: #8a7a55; }
.ticket strong { display: block; font: 800 34px/1.05 var(--cond); margin: 10px 0 6px; text-transform: uppercase; }
.ticket .sub { color: #5a5240; }
.ticket .fields { display: flex; gap: 22px; margin-top: 16px; font-family: var(--mono); font-size: 12px; color: #8a7a55; }
.ticket .fields b { display: block; color: var(--paper-ink); font-size: 15px; }
.ticket .stub .big { font: 800 40px/1 var(--cond); }
.barcode { width: 100%; height: 46px; background: repeating-linear-gradient(90deg, #1d2633 0 2px, transparent 2px 4px, #1d2633 4px 5px, transparent 5px 8px, #1d2633 8px 11px, transparent 11px 12px); }
.barcode.v { width: 46px; height: 100%; min-height: 90px; background: repeating-linear-gradient(0deg, #1d2633 0 2px, transparent 2px 4px, #1d2633 4px 5px, transparent 5px 8px, #1d2633 8px 11px, transparent 11px 12px); }
.demo-row { margin-top: 14px; }
.mapgrid { display: grid; grid-template-columns: 170px 1fr; gap: 10px 14px; align-items: center; }
.mapgrid .lbl { font: 600 15px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
select, input[type=text], input[type=search], textarea { background: var(--night2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { width: 100%; resize: vertical; line-height: 1.55; }
input[type=text] { width: 100%; }

/* ---------- Luggage tags (stats) ---------- */
.tags { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 22px; }
.ltag { position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 6px 14px 14px 6px; padding: 12px 18px 12px 34px; min-width: 150px; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%); }
.ltag::before { content: ""; position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: var(--night); transform: translateY(-50%); box-shadow: 0 0 0 2px #b9a77d; }
.ltag b { display: block; font: 800 26px/1.1 var(--mono); }
.ltag span { font: 600 14px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: #6b5f45; }
.ltag.orange { background: #ffd7b0; } .ltag.green { background: #cdeedc; } .ltag.red { background: #ffd0d0; } .ltag.blue { background: #d3e8fb; }

/* ---------- Baggage carousel ---------- */
.carousel { position: relative; height: 158px; margin: 0 0 22px; border-radius: 14px; overflow: hidden; background: #0a0d12; box-shadow: inset 0 0 0 1px #20252c; }
.carousel .belt { position: absolute; left: 0; right: 0; bottom: 28px; height: 30px; background: repeating-linear-gradient(90deg, #2b2f36 0 36px, #1d2026 36px 40px); animation: belt 1.6s linear infinite; border-top: 3px solid #3a3f48; border-bottom: 3px solid #121418; }
@keyframes belt { to { background-position: 40px 0; } }
.carousel .lane { position: absolute; left: 0; bottom: 61px; display: flex; align-items: flex-end; gap: 30px; width: max-content; animation: lane 60s linear infinite; padding-left: 20px; }
@keyframes lane { to { transform: translateX(-50%); } }
.bag { position: relative; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; }
.bag .cases { display: flex; }
.bag .cases .case + .case { margin-left: -18px; margin-top: 6px; }
.bag .case { width: 58px; height: 42px; border-radius: 8px; position: relative; box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .18); }
.bag .case::before { content: ""; position: absolute; left: 18px; right: 18px; top: -7px; height: 8px; border: 3px solid rgba(0, 0, 0, .45); border-bottom: 0; border-radius: 6px 6px 0 0; }
.bag .case::after { content: ""; position: absolute; left: 10px; right: 10px; top: 10px; height: 3px; background: rgba(0, 0, 0, .18); box-shadow: 0 10px 0 rgba(0, 0, 0, .18); }
.bag .label { background: var(--paper); color: var(--paper-ink); font: 600 12px/1.1 var(--mono); border-radius: 3px; padding: 4px 6px; white-space: nowrap; transform: rotate(-4deg); box-shadow: 0 2px 4px rgba(0, 0, 0, .4); }
.bag .label small { display: block; color: #7a6d52; font-size: 10px; }
.bag.twin .label { background: #ffe4a6; }
.bag.held .label { background: #ffd0d0; }
.carousel .sign { position: absolute; bottom: 8px; left: 14px; z-index: 2; font: 800 13px/1 var(--mono); color: var(--sign); letter-spacing: .16em; }

/* ---------- Tabs + manifest table ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { background: var(--night2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; color: var(--muted); font: 600 15px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; }
.tabs button.on { color: var(--sign-ink); background: var(--sign); border-color: var(--sign); }
.manifest-head { display: flex; align-items: center; gap: 12px; background: #07090c; color: var(--sign); border-radius: 12px 12px 0 0; padding: 10px 14px; font: 800 14px/1 var(--mono); letter-spacing: .14em; border: 1px solid #20252c; border-bottom: 0; margin-top: 14px; }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 0 0 12px 12px; max-height: 560px; background: var(--night2); }
.tablewrap.round { border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #22344f; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
th { position: sticky; top: 0; background: var(--panel2); font: 600 14px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); z-index: 1; }
tr:hover td { background: rgba(255, 255, 255, .03); }
td.fixed { color: var(--green); }
td.fixed::after { content: " ✎"; color: var(--muted); font-size: 11px; }
td.rownum { color: var(--muted); font-family: var(--mono); font-size: 13px; }
tr.click { cursor: pointer; }
tr.sel td { background: rgba(255, 204, 26, .08); }
.pill { display: inline-block; font: 800 11px/1 var(--mono); padding: 4px 7px; border-radius: 4px; letter-spacing: .06em; }
.pill.mayday { background: var(--red); color: #2a0000; }
.pill.turbulence { background: var(--yellow); color: #2a1d00; }
.pill.clear { background: var(--green); color: #00241a; }
.pill.lost { background: #3a4a60; color: var(--ink); }

/* ---------- Control Tower: flight strips in a strip bay ---------- */
.bay { background: #0b1019; border: 1px solid #1f2a3b; border-radius: 14px; padding: 14px; display: grid; gap: 14px; }
.leg { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 900px) { .leg { grid-template-columns: 1fr; } }
.strip { background: var(--paper); color: var(--paper-ink); border-radius: 4px; display: grid; grid-template-columns: 84px 1fr; box-shadow: 0 4px 0 #b9ab88, 0 10px 20px rgba(0, 0, 0, .3); overflow: hidden; }
.strip .side { background: var(--paper2); border-right: 2px solid var(--paper-line); padding: 12px 8px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.strip .side .callsign { font: 800 22px/1 var(--mono); }
.strip .side .day { font: 600 13px/1 var(--cond); letter-spacing: .1em; color: #7a6d52; text-transform: uppercase; }
.strip .side .band { width: 100%; height: 6px; background: var(--hivis); border-radius: 2px; }
.strip .side .band.mayday { background: var(--red); } .strip .side .band.clear { background: var(--green); } .strip .side .band.turbulence { background: var(--yellow); }
.strip .body { padding: 10px 14px 14px; }
.strip label { display: block; font: 600 13px/1 var(--cond); color: #7a6d52; margin: 10px 0 5px; letter-spacing: .12em; text-transform: uppercase; }
.strip input[type=text], .strip textarea { background: #fffdf6; border: 1px solid #d9cdb0; color: var(--paper-ink); }
.strip input[type=text]::placeholder, .strip textarea::placeholder { color: #a99c7c; }
.strip .x { background: none; border: 0; color: #8a7a55; cursor: pointer; font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.chip { font: 500 12px/1 var(--mono); background: var(--night2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; cursor: pointer; }
.chip:hover { border-color: var(--sign); color: var(--sign); }
.radiolog { background: #06110b; border: 1px solid #173326; border-radius: 10px; padding: 12px 14px; font-family: var(--mono); color: #b9f5d8; display: flex; flex-direction: column; }
.radiolog .rhead { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5fae8a; letter-spacing: .12em; margin-bottom: 8px; }
.radiolog ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; line-height: 1.4; }
.radiolog li { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
.radiolog li .who { color: #5fae8a; }
.radiolog li.mayday { color: #ffb3b3; } .radiolog li.mayday .who { color: var(--red); }
.radiolog li.turbulence { color: #ffe6a8; } .radiolog li.turbulence .who { color: var(--yellow); }
.gauge { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.gauge svg { width: 86px; height: 86px; flex: none; }
.gauge .lbl { font-size: 11px; letter-spacing: .14em; color: #5fae8a; }
.gauge .val { font: 800 28px/1 var(--mono); color: #e6fff3; }

/* ---------- Security Check: the scanner ---------- */
.scanner { position: relative; height: 150px; border-radius: 14px; overflow: hidden; background: #0a0d12; box-shadow: inset 0 0 0 1px #20252c; margin: 14px 0; }
.scanner .belt { position: absolute; left: 0; right: 0; bottom: 30px; height: 26px; background: repeating-linear-gradient(90deg, #2b2f36 0 36px, #1d2026 36px 40px); animation: belt .7s linear infinite; }
.scanner .tunnel { position: absolute; left: 50%; bottom: 22px; width: 150px; height: 104px; transform: translateX(-50%); background: linear-gradient(180deg, #2c3e57, #1b2a40); border-radius: 18px 18px 6px 6px; box-shadow: inset 0 -30px 40px rgba(0, 0, 0, .5); z-index: 2; display: grid; place-items: center; }
.scanner .tunnel::before { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 60px; background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .55) 0 6px, rgba(0, 0, 0, .35) 6px 8px); border-radius: 4px 4px 0 0; }
.scanner .tunnel .beam { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font: 800 11px/1 var(--mono); color: var(--green); letter-spacing: .14em; }
.scanner .tunnel .beam.alarm { color: var(--red); animation: lamp .4s steps(2) infinite; }
.scanner .flow { position: absolute; left: 0; bottom: 44px; display: flex; gap: 34px; width: max-content; animation: lane 14s linear infinite; }
.scanner .flow .case { width: 46px; height: 32px; border-radius: 7px; position: relative; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2); }
.scanner .flow .case.held { outline: 3px solid var(--red); outline-offset: 2px; }
.scanner .inspect { position: absolute; right: 12px; top: 10px; font: 800 12px/1 var(--mono); color: var(--red); letter-spacing: .1em; text-align: right; }
.scanner .count { position: absolute; left: 14px; top: 10px; font: 800 12px/1.5 var(--mono); color: var(--sign); letter-spacing: .1em; }
.progress { height: 8px; background: var(--night2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--sign); width: 0; }

/* ---------- Boarding pass ---------- */
.pass { background: var(--paper); color: var(--paper-ink); border-radius: 16px; position: relative; box-shadow: 0 14px 40px rgba(0, 0, 0, .35); overflow: hidden; }
.pass .top { display: grid; grid-template-columns: 1fr 112px; border-bottom: 2px dashed var(--paper-line); }
.pass .main { padding: 16px 20px; border-right: 2px dashed var(--paper-line); }
.pass .stub { padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pass .airline { display: flex; justify-content: space-between; font: 800 12px/1 var(--mono); letter-spacing: .2em; color: #8a7a55; }
.pass .route { display: flex; align-items: center; gap: 14px; margin: 12px 0; }
.pass .route .code { font: 800 34px/1 var(--cond); }
.pass .route .ico { width: 26px; height: 26px; color: #8a7a55; }
.pass .route small { display: block; font: 600 11px/1 var(--mono); color: #8a7a55; letter-spacing: .1em; margin-top: 4px; }
.pass .fields { display: grid; grid-template-columns: repeat(4, auto); gap: 8px 18px; font: 600 11px/1.2 var(--mono); color: #8a7a55; letter-spacing: .08em; }
.pass .fields b { display: block; color: var(--paper-ink); font-size: 14px; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.stamp { position: absolute; right: 8px; top: 46px; transform: rotate(-14deg); font: 800 24px/1 var(--cond); background: rgba(246, 240, 225, .85); letter-spacing: .1em; border: 4px solid; border-radius: 8px; padding: 4px 10px; opacity: .85; pointer-events: none; }
.stamp.held { color: #c62828; border-color: #c62828; }
.stamp.boarded { color: #1b7f4f; border-color: #1b7f4f; }
.pass .emails { padding: 6px 20px 18px; max-height: 620px; overflow: auto; }
.pass h4 { margin: 14px 0 6px; font: 800 13px/1 var(--mono); letter-spacing: .16em; color: #8a7a55; }
.pass pre { white-space: pre-wrap; word-wrap: break-word; font: 15px/1.55 var(--sans); margin: 0; background: #fffdf6; border: 1px solid #e6dcc6; border-radius: 8px; padding: 12px 14px; }
.pass .subj { font-weight: 700; margin-bottom: 8px; }
.pass .iss { margin: 6px 0 0; font-size: 14px; display: grid; gap: 4px; }
.gap { background: #ffc9c9; outline: 2px solid #e53935; border-radius: 3px; padding: 0 3px; color: #b71c1c; font: 800 12px/1 var(--mono); }

/* ---------- Take-off ---------- */
.runway { position: relative; height: 220px; border-radius: 16px; overflow: hidden; margin: 0 0 22px; background: linear-gradient(180deg, #ff9a5a 0%, #ffcf8a 38%, #3a4659 39%, #2a3442 100%); }
.runway .sun { position: absolute; left: 62%; top: 30px; width: 70px; height: 70px; border-radius: 50%; background: #ffe9b8; box-shadow: 0 0 60px #ffd27a; }
.runway .strip { position: absolute; left: -10%; right: -10%; bottom: 26px; height: 60px; background: #232a33; transform: perspective(300px) rotateX(35deg); box-shadow: none; display: block; border-radius: 0; }
.runway .strip::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); background: repeating-linear-gradient(90deg, #f2f2f2 0 40px, transparent 40px 80px); }
.runway .lights { position: absolute; left: 0; right: 0; bottom: 14px; height: 6px; background: repeating-linear-gradient(90deg, #ffd36b 0 6px, transparent 6px 40px); filter: drop-shadow(0 0 4px #ffd36b); }
.runway .jet { position: absolute; left: 6%; bottom: 66px; width: 170px; color: #f4f7fb; transition: transform 2.6s cubic-bezier(.5, 0, .9, .6); }
.runway.go .jet { transform: translate(115vw, -150px) rotate(-12deg); }
.runway.grounded .caption { color: #5a1010; }
.runway .caption { position: absolute; left: 20px; top: 18px; font: 800 30px/1 var(--cond); color: #3a1d00; letter-spacing: .04em; text-transform: uppercase; }
.files .card { position: relative; padding-left: 26px; }
.files .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; border-radius: 14px 0 0 14px; background: var(--sign); }
.files .card h3 { font-family: var(--mono); text-transform: none; letter-spacing: 0; }

/* ---------- Footer: runway edge lights ---------- */
footer { color: var(--muted); font-size: 14px; padding: 26px 0 40px; position: relative; }
.edge { height: 10px; margin: 0 0 18px; background: repeating-linear-gradient(90deg, transparent 0 34px, #ffd36b 34px 40px); filter: drop-shadow(0 0 5px rgba(255, 211, 107, .8)); animation: edge 2.8s steps(7) infinite; opacity: .8; }
@keyframes edge { 50% { opacity: .45; } }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

/* ---------- Calm mode ---------- */
body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
