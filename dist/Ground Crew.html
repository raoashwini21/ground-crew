<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Ground Crew · the pre-flight check for outbound</title>
<style>:root {
  --bg: #0e1a2b;
  --bg2: #13233a;
  --panel: #182b45;
  --panel2: #1e3453;
  --line: #2a4466;
  --ink: #eef3f9;
  --muted: #a3b4ca;
  --amber: #ffb547;
  --amber-ink: #2a1a00;
  --green: #4fd69c;
  --red: #ff7a7a;
  --yellow: #ffd36b;
  --blue: #7cc4ff;
  --radius: 14px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* Header */
header.top { position: sticky; top: 0; z-index: 5; background: rgba(14, 26, 43, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 60px; flex-wrap: wrap; }
.brand { font-weight: 800; letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
.brand small { font-weight: 500; letter-spacing: 0; color: var(--muted); }
nav.stations { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
nav.stations button { background: none; border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; color: var(--muted); cursor: pointer; }
nav.stations button.on { color: var(--ink); border-color: var(--line); background: var(--panel); }
nav.stations button:disabled { opacity: .4; cursor: default; }
nav.stations button .n { font-family: var(--mono); font-size: 12px; margin-right: 6px; color: var(--amber); }
.radio { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
.radio .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(79, 214, 156, .18); }
.radio.warn .dot { background: var(--yellow); box-shadow: 0 0 0 3px rgba(255, 211, 107, .18); }
.radio.bad .dot { background: var(--red); }

main { padding: 28px 0 80px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
h2 { font-size: 22px; margin: 0 0 4px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 70ch; }
.marshal { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin: 0 0 20px; }
.marshal .who { font-size: 22px; line-height: 1; }
.marshal p { margin: 0; }
.marshal b { color: var(--amber); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }

.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 700; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.small { font-size: 13px; }

/* Check-in */
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 40px 20px; text-align: center; background: var(--bg2); cursor: pointer; }
.drop.over { border-color: var(--amber); background: var(--panel); }
.drop strong { display: block; font-size: 18px; margin-bottom: 4px; }
.mapgrid { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; align-items: center; }
select, input[type=text], input[type=search], textarea { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input[type=text] { width: 100%; }

/* Stats */
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; min-width: 130px; }
.stat b { display: block; font-size: 22px; font-family: var(--mono); }
.stat span { color: var(--muted); font-size: 13px; }

/* Tabs + tables */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.tabs button { background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--muted); }
.tabs button.on { color: var(--ink); background: var(--panel2); border-color: var(--muted); }
.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 560px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
th { position: sticky; top: 0; background: var(--panel2); font-weight: 600; z-index: 1; }
tr:hover td { background: rgba(255, 255, 255, .03); }
td.fixed { color: var(--green); }
td.fixed::after { content: " ✎"; color: var(--muted); font-size: 11px; }
td.rownum { color: var(--muted); font-family: var(--mono); }
tr.click { cursor: pointer; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; font-family: var(--mono); }
.pill.mayday { background: rgba(255, 122, 122, .16); color: var(--red); }
.pill.turbulence { background: rgba(255, 211, 107, .14); color: var(--yellow); }
.pill.clear { background: rgba(79, 214, 156, .14); color: var(--green); }
.pill.lost { background: rgba(163, 180, 202, .16); color: var(--muted); }

/* Tower */
.legs { display: grid; gap: 18px; }
.leg { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .leg { grid-template-columns: 1fr; } }
.strip { background: var(--bg2); border: 1px solid var(--line); border-left: 6px solid var(--amber); border-radius: 10px; padding: 14px; }
.strip label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; letter-spacing: .04em; text-transform: uppercase; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
.chip { font-family: var(--mono); font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.chip:hover { border-color: var(--amber); }
.calls { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.calls ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.calls li { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.alt { display: flex; align-items: center; gap: 10px; }
.alt .bar { flex: 1; height: 8px; background: var(--bg2); border-radius: 99px; overflow: hidden; }
.alt .bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .25s; }
.alt b { font-family: var(--mono); font-size: 20px; min-width: 2.5ch; text-align: right; }

/* Gate */
.board { background: #0a0f17; border: 1px solid #000; border-radius: 12px; padding: 14px 18px; font-family: var(--mono); display: grid; grid-template-columns: max-content 1fr; gap: 6px 22px; margin: 0 0 18px; box-shadow: inset 0 0 0 1px #1b2633; }
.board .k { color: #8796a8; letter-spacing: .1em; }
.board .v { color: var(--yellow); letter-spacing: .14em; font-weight: 700; }
.board .v.ok { color: var(--green); }
.board .v.bad { color: var(--red); }
.progress { height: 10px; background: var(--bg2); border-radius: 99px; overflow: hidden; margin: 10px 0; }
.progress i { display: block; height: 100%; background: var(--amber); width: 0; }
.pass { background: #fbf7ee; color: #1d2633; border-radius: 14px; padding: 18px 20px; }
.pass .head { display: flex; justify-content: space-between; gap: 10px; border-bottom: 2px dashed #c9bfa8; padding-bottom: 10px; margin-bottom: 12px; font-family: var(--mono); font-size: 13px; }
.pass h4 { margin: 14px 0 4px; font-size: 12px; letter-spacing: .1em; color: #7a6d52; }
.pass pre { white-space: pre-wrap; word-wrap: break-word; font: 14px/1.55 var(--sans); margin: 0; background: #fff; border: 1px solid #e6dcc6; border-radius: 8px; padding: 10px 12px; }
.pass .subj { font-weight: 700; margin-bottom: 6px; }
.pass .iss { margin: 6px 0 0; font-size: 13px; }
.pass .iss .pill.mayday { background: #ffe1e1; color: #b3261e; }
.pass .iss .pill.turbulence { background: #fff1c7; color: #8a5a00; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
.note { font-size: 13px; color: var(--muted); }
footer { color: var(--muted); font-size: 13px; padding: 30px 0; border-top: 1px solid var(--line); }
</style>
</head>
